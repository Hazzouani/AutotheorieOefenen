ng></figcaption></figure><figure><img loading="lazy" src="../images/question-005.svg" alt="De blauwe auto wil rechtsaf. Een voetganger loopt op het rechtertrottoir in dezelfde richting en wil de zijstraat rechtdoor oversteken."><figcaption><strong>Vraag 5</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-006.svg" alt="De blauwe auto nadert van onderen en wil linksaf. De tegemoetkomende amberkleurige auto wil rechtsaf dezelfde zijstraat in."><figcaption><strong>Vraag 6</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-007.svg" alt="Een blauwe auto rijdt vanuit een inrit naar de straat. Een voetganger loopt over het doorlopende trottoir voor de inrit."><figcaption><strong>Vraag 7</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-008.svg" alt="De blauwe auto staat met zijn neus in een parkeervak en rijdt achteruit richting de rijroute. Daar nadert een amberkleurige auto van rechts."><figcaption><strong>Vraag 8</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-009.svg" alt="Binnen een bebouwde omgeving staat een autobus in een haltekom. De linker richtingaanwijzer brandt; de blauwe auto nadert van achteren."><figcaption><strong>Vraag 9</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-010.svg" alt="Een blauwe auto nadert een zebrapad. Een voetganger staat rechts aan de rand van de oversteekplaats; er zijn geen verkeerslichten."><figcaption><strong>Vraag 10</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-011.svg" alt="Een blauwe auto nadert een persoon met een witte stok met rode ringen die aan de rechterkant van de straat wil oversteken. Er ligt geen zebrapad."><figcaption><strong>Vraag 11</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-012.svg" alt="Een blauwe auto rijdt op een buitenweg in mist. Verderop vervagen de wegmarkeringen en een auto in de mist."><figcaption><strong>Vraag 12</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-013.svg" alt="Een blauwe auto rijdt in een straat met huizen, stoepen en een plaatsnaambord. Er staat geen snelheidsbord."><figcaption><strong>Vraag 13</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-014.svg" alt="Een blauwe personenauto rijdt over een gewone buitenweg met landbouwgrond en bomen. Er staan geen snelheids- of autowegborden."><figcaption><strong>Vraag 14</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-015.svg" alt="Een blauwe personenauto zonder aanhanger rijdt over een buitenweg met het autowegbord. Er staat geen lagere maximumsnelheid aangegeven."><figcaption><strong>Vraag 15</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-016.svg" alt="Een blauwe auto bevindt zich in een erf met klinkerbestrating, huizen, spelende kinderen, voetgangers en het erf-bord."><figcaption><strong>Vraag 16</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-017.svg" alt="Een blauwe auto met een aanhanger rijdt op een autosnelweg. Een bord geeft 100 aan; bij de aanhanger staat de toegestane maximummassa van 1.500 kilogram."><figcaption><strong>Vraag 17</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-018.svg" alt="Een vrijwel lege autosnelweg met drie doorgaande rijstroken en een afgescheiden vluchtstrook. De blauwe auto nadert over de middelste strook."><figcaption><strong>Vraag 18</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-019.svg" alt="Op een gewone tweerichtingsweg rijdt een blauwe auto achter een witte auto. De middenstreep is onderbroken en er is verder vrij zicht."><figcaption><strong>Vraag 19</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-020.svg" alt="Een witte auto staat links voorgesorteerd met de linker rich </strong></figcaption></figure><figure><img loading="lazy" src="../images/question-030.svg" alt="De blauwe auto staat langs de rechterkant van een straat, vlak bij het kruispunt. Een maatlijn tussen de voorzijde en het kruispunt is aangeduid met 2 meter."><figcaption><strong>Vraag 30</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-031.svg" alt="Een blauwe auto staat op de rijbaan naast een witte auto in een parkeerstrook. Aan de rechterkant staat een winkel met een pakketje bij de ingang."><figcaption><strong>Vraag 31</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-032.svg" alt="De blauwe auto bevindt zich direct naast een rood gemarkeerde fietsstrook aan de rechterzijde van de rijbaan. Verderop rijdt een fietser over de strook."><figcaption><strong>Vraag 32</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-033.svg" alt="Een blauwe auto staat langs de straat voor een brede inrit die naar een garage leidt. Het trottoir loopt herkenbaar door voor de inrit."><figcaption><strong>Vraag 33</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-034.svg" alt="Een blauwe auto is op een autosnelweg een afrit voorbijgereden. Rechts buigt de uitrijstrook af, met een driehoekig puntstuk tussen afrit en doorgaande rijbaan."><figcaption><strong>Vraag 34</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-036.svg" alt="Een groot geel ruitvormig bord met witte rand naast een weg met een blauwe auto."><figcaption><strong>Vraag 36</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-037.svg" alt="Een omgekeerd driehoekig bord met rode rand. Rechts nadert een blauwe auto een kruispunt met witte driehoeken op het wegdek."><figcaption><strong>Vraag 37</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-038.svg" alt="Een rood achthoekig bord met het woord STOP. Rechts staat ee ert een scherpe bocht naar rechts. Bomen aan de binnenzijde beperken het overzicht. Naast de weg staat een bord 80."><figcaption><strong>Vraag 70</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-071.svg" alt="Een blauwe auto rijdt op een donkere buitenweg. De bundel dimlicht verlicht slechts een deel van de rijbaan voor de auto."><figcaption><strong>Vraag 71</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-072.svg" alt="Twee auto’s rijden naar rechts op een natte weg tijdens een stevige regenbui. De blauwe auto rijdt achter de amberkleurige auto."><figcaption><strong>Vraag 72</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-073.svg" alt="Op een rechte weg rijdt een witte auto erg dicht achter de blauwe auto. De rijbaan voor de blauwe auto is vrij."><figcaption><strong>Vraag 73</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-074.svg" alt="De blauwe auto nadert op een autosnelweg een rij voertuigen. Verderop branden de remlichten in meerdere rijstroken."><figcaption><strong>Vraag 74</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-075.svg" alt="Een blauwe auto nadert van onderen een kruispunt zonder voorrangsborden of verkeerslichten. Een brede hoge heg staat op de hoek rechts."><figcaption><strong>Vraag 75</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-076.svg" alt="Een blauwe auto wil vanaf de onderste tak rechtsaf bij een rond groen verkeerslicht. Rechts naast de auto rijdt een fietser rechtdoor."><figcaption><strong>Vraag 76</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-077.svg" alt="Een fietser rijdt naar rechts langs een rij geparkeerde auto’s. Een blauwe auto nadert de fietser van achteren."><figcaption><strong>Vraag 77</strong></figcaption></figure><figure><img loading="lazy" src="../images/question-078.svg" alt="Een blauwe aut
